[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caf-cli"
version = "0.1.0.dev0"
description = "Encrypt bundles for the Confidential Assurance Framework and verify signed results"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43",
  "pyhpke>=0.6",
  "google-cloud-kms>=3",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
]

[project.scripts]
caf = "caf_cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["caf_cli"]
