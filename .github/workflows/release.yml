name: release

# Builds the workload image reproducibly, then publishes the digest with SLSA provenance, a cosign signature
# (keyless, recorded in Rekor), and the SBOM. Independent rebuilders compare their digest with this one.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write   # keyless signing and SLSA provenance
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reproducible build
        id: build
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          docker buildx build -f workload/Dockerfile . \
            --output "type=image,name=ghcr.io/${{ github.repository }}/workload:${{ github.ref_name }},push=true,rewrite-timestamp=true" \
            --provenance=false --sbom=false \
            --metadata-file meta.json
          echo "digest=$(jq -r '."containerimage.digest"' meta.json)" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless, logged to Rekor)
        run: cosign sign --yes "ghcr.io/${{ github.repository }}/workload@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/workload
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  rebuild-check:
    # A second, independent build on a fresh runner must produce the same digest.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          docker buildx build -f workload/Dockerfile . \
            --output "type=oci,dest=rebuild.tar,rewrite-timestamp=true" --provenance=false --sbom=false \
            --metadata-file meta.json
          got="$(jq -r '."containerimage.digest"' meta.json)"
          test "$got" = "${{ needs.build.outputs.digest }}" || { echo "NOT REPRODUCIBLE: $got"; exit 1; }

  publish:
    needs: [build, rebuild-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes with digest and attestation policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Workload image digest: \`${{ needs.build.outputs.digest }}\`"
            echo
            echo "Reproduce with: \`git checkout ${{ github.ref_name }} && make reproduce\`"
            echo
            echo "Attestation policy: infra/terraform/wip.tf at this tag."
          } > notes.md
          gh release create "${{ github.ref_name }}" --notes-file notes.md --verify-tag
